; 연구실 문패 펌웨어 (TTGO T-Display 클론, 원조 ESP32)
;
; tdisplay_lp : arduino + espidf 하이브리드. 자동 라이트슬립(CONFIG_PM_ENABLE) 사용 — 기본
; tdisplay    : arduino 단독(라이트슬립 불가, 전류 큼). 비교/비상용
[platformio]
default_envs = tdisplay_lp

[env]
platform = espressif32
board = esp32dev
monitor_speed = 115200
upload_port = /dev/cu.usbserial-59160001851
monitor_port = /dev/cu.usbserial-59160001851
lib_deps =
  zinggjm/GxEPD2

[env:tdisplay_lp]
framework = arduino, espidf

[env:tdisplay]
framework = arduino
